# ============================================================
# FR-CI-02: Docker Compose — production / CI base file
#
# Usage:
#   CI / production:  docker-compose -f docker-compose.yml up --build
#   Local dev:        docker-compose up --build
#                     (auto-merges docker-compose.override.yml)
# ============================================================

# Issue 14 fix: version: key removed — deprecated in Compose v2

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=${MODEL_PATH:-/app/models/traffic_sign_model_mobilenetv2.pth}
      - API_KEY=${API_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - ENABLE_CLOUDWATCH=${ENABLE_CLOUDWATCH:-0}
      # Issue 18 fix: tell torch how many CPUs the container actually has
      - CPU_LIMIT=2
    # NFR-REL-01: restart automatically on crash
    restart: always
    # Issue 21 fix: resource limits so container can't starve the host
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M