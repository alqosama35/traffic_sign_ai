upstream inference { server inference-svc:8001; }
upstream cv        { server cv-svc:8002; }
upstream ga        { server ga-svc:8003; }
upstream dashboard { server dashboard-svc:8004; }

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # ── Inference endpoints ──────────────────────────────────────────────────
    location = /predict {
        proxy_pass         http://inference;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = / {
        proxy_pass http://inference;
    }

    location /docs {
        proxy_pass http://inference;
    }

    location /openapi.json {
        proxy_pass http://inference;
    }

    # ── CV service ───────────────────────────────────────────────────────────
    location /cv/ {
        proxy_pass http://cv/;
    }

    # ── GA service ───────────────────────────────────────────────────────────
    location /ga/ {
        proxy_pass http://ga/;
    }

    # ── Dashboard (static + data API + predict relay) ────────────────────────
    location /dashboard/ {
        proxy_pass         http://dashboard/dashboard/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── Aggregate health check ───────────────────────────────────────────────
    location = /health {
        proxy_pass http://dashboard/health;
    }
}
