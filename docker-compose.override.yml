# ============================================================
# LOCAL DEVELOPMENT ONLY — auto-merged by Docker Compose
# Never used in CI (CI passes -f docker-compose.yml explicitly)
# ============================================================

services:
  api:
    # Override CMD: add --reload so uvicorn restarts on file save
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Live mount: changes to api/ are instant — no rebuild needed
      - ./api:/app/api
    environment:
      # Issue 5 fix: DEV_MODE=1 disables API key enforcement locally
      - DEV_MODE=1
      - MODEL_PATH=${MODEL_PATH:-/app/models/traffic_sign_model_mobilenetv2.pth}
      - ENABLE_CLOUDWATCH=0
      - CPU_LIMIT=2
    # Override restart: crashes stay stopped so you can read the error
    restart: "no"