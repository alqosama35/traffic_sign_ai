# ============================================================
# LOCAL DEVELOPMENT ONLY — auto-merged by Docker Compose
# Never used in CI (CI passes -f docker-compose.yml explicitly)
# ============================================================

services:
  api:
    # Override CMD: add --reload so uvicorn restarts on file save
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # Live mount: changes to api/ are instant — no rebuild needed
      - ./api:/app/api
      - ./dashboard:/app/dashboard:ro
      - ./training/outputs/model/mobilenetv2_inference.pth:/app/models/mobilenetv2_inference.pth:ro
      - ./ea/results:/app/ea/results:ro
      - ./training/outputs/logs:/app/training/outputs/logs:ro
      - ./training/outputs/plots:/app/training/outputs/plots:ro
    environment:
      # Empty API_KEY disables auth enforcement in local dev (see app.py:27)
      - API_KEY=
      - MODEL_PATH=${MODEL_PATH:-/app/models/mobilenetv2_inference.pth}
      - ENABLE_CLOUDWATCH=0
      - CPU_LIMIT=2
    # Override restart: crashes stay stopped so you can read the error
    restart: "no"