# ============================================================
# FR-CI-03: CI/CD Pipeline — Build · Test · Push · Deploy
# FR-CI-04: Every stage depends on the previous (needs:)
# FR-CI-05: Image tagged <ecr-repo>:<short-git-sha>
# ============================================================

name: Build · Test · Push · Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: traffic-sign-api

jobs:
  # ════════════════════════════════════════════════════════
  # STAGE 1 — BUILD
  # ════════════════════════════════════════════════════════
  build:
    name: "Stage 1 · Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Issue 15 fix: never hang the runner for 6h

    steps:
      - uses: actions/checkout@v4

      # Issue 11 fix: use short SHA (7 chars) not full 40-char SHA
      - name: Compute short SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      - name: Save image tar for downstream jobs
        run: docker save $ECR_REGISTRY/$ECR_REPOSITORY:latest -o /tmp/inference.tar

      - uses: actions/upload-artifact@v4
        with:
          name: inference-image
          path: /tmp/inference.tar
          retention-days: 1

  # ════════════════════════════════════════════════════════
  # STAGE 2 — TEST
  # Issue 1 fix: MODEL_TEST_MODE=1 starts the container with
  # random weights so no .pth file is needed in CI.
  # ════════════════════════════════════════════════════════
  test:
    name: "Stage 2 · Test"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: inference-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/inference.tar

      # Issue 1 fix: MODEL_TEST_MODE=1 + DEV_MODE=1 — no .pth, no API key needed
      - name: Start container
        run: |
          docker run -d \
            --name inference-api \
            -p 8000:8000 \
            -e MODEL_TEST_MODE=1 \
            -e DEV_MODE=1 \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for /health ..."
          for i in $(seq 1 20); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              http://localhost:8000/health 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "Healthy." && exit 0
            echo "Attempt $i — HTTP $STATUS, retrying in 3s ..."
            sleep 3
          done
          echo "Container never became healthy."
          docker logs inference-api
          exit 1

      - name: Install test deps
        run: pip install requests pillow

      - name: Run test_api.py
        run: python test_api.py

      - name: Dump container logs on failure
        if: failure()
        run: docker logs inference-api

  # ════════════════════════════════════════════════════════
  # STAGE 3 — PUSH TO ECR
  # ════════════════════════════════════════════════════════
  push-to-ecr:
    name: "Stage 3 · Push to ECR"
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: inference-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/inference.tar

      # Re-tag with the correct short SHA (the saved tar has :latest)
      - name: Re-tag with short SHA
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                     $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Authenticate to ECR
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Push image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Issue 16 fix: keep only last 10 images in ECR to control storage cost
      - name: Apply ECR lifecycle policy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr put-lifecycle-policy \
            --region $AWS_REGION \
            --repository-name $ECR_REPOSITORY \
            --lifecycle-policy-text '{
              "rules":[{
                "rulePriority":1,
                "description":"Keep last 10 images",
                "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
                "action":{"type":"expire"}
              }]
            }'

  # ════════════════════════════════════════════════════════
  # STAGE 4 — DEPLOY TO EC2
  # Issue 2 fix: NO AWS credentials passed over SSH.
  #   The EC2 instance must have an IAM instance profile with:
  #   - ecr:GetAuthorizationToken
  #   - ecr:BatchGetImage + ecr:GetDownloadUrlForLayer
  #   - s3:GetObject on models/ prefix
  #   The AWS CLI on EC2 reads credentials from the metadata service.
  # Issue 3 fix: StrictHostKeyChecking=no removed.
  #   ssh-keyscan already populates known_hosts — that's enough.
  # Issue 17 fix: rollback to previous image if health check fails.
  # ════════════════════════════════════════════════════════
  deploy:
    name: "Stage 4 · Deploy to EC2"
    runs-on: ubuntu-latest
    needs: push-to-ecr
    timeout-minutes: 10

    steps:
      - name: Compute short SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Issue 2+3 fix: no AWS creds in env, no StrictHostKeyChecking=no
      # EC2 IAM role provides AWS credentials inside the instance automatically
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "
                set -e

                REGISTRY=$ECR_REGISTRY
                REPO=$ECR_REPOSITORY
                TAG=$IMAGE_TAG
                FULL_IMAGE=\$REGISTRY/\$REPO:\$TAG
                MODEL_PATH_VAL='${{ secrets.MODEL_PATH }}'
                API_KEY_VAL='${{ secrets.API_KEY }}'
                REGION=$AWS_REGION

                # Record previous image for rollback (Issue 17 fix)
                PREV_IMAGE=\$(docker inspect inference-api \
                  --format='{{.Config.Image}}' 2>/dev/null || echo 'none')
                echo \"Previous image: \$PREV_IMAGE\"

                # Authenticate Docker to ECR using EC2 IAM role (Issue 2 fix)
                aws ecr get-login-password --region \$REGION | \
                  docker login --username AWS --password-stdin \$REGISTRY

                docker pull \$FULL_IMAGE

                # Stop old container
                docker stop inference-api 2>/dev/null || true
                docker rm   inference-api 2>/dev/null || true

                # Start new container
                docker run -d \
                  --name inference-api \
                  --restart always \
                  -p 8000:8000 \
                  -e MODEL_PATH=\$MODEL_PATH_VAL \
                  -e API_KEY=\$API_KEY_VAL \
                  -e AWS_REGION=\$REGION \
                  -e ENABLE_CLOUDWATCH=1 \
                  -e CPU_LIMIT=2 \
                  \$FULL_IMAGE

                # Health check with rollback on failure (Issue 17 fix)
                echo 'Waiting for new container ...'
                HEALTHY=0
                for i in \$(seq 1 10); do
                  STATUS=\$(curl -sf -o /dev/null -w '%{http_code}' \
                    http://localhost:8000/health 2>/dev/null || echo '000')
                  if [ \"\$STATUS\" = '200' ]; then
                    HEALTHY=1
                    echo 'New container is healthy.'
                    break
                  fi
                  echo \"Attempt \$i — HTTP \$STATUS, retrying ...\"
                  sleep 3
                done

                if [ \$HEALTHY -eq 0 ]; then
                  echo 'HEALTH CHECK FAILED — rolling back to previous image'
                  docker stop inference-api 2>/dev/null || true
                  docker rm   inference-api 2>/dev/null || true
                  if [ \"\$PREV_IMAGE\" != 'none' ]; then
                    docker run -d \
                      --name inference-api \
                      --restart always \
                      -p 8000:8000 \
                      -e MODEL_PATH=\$MODEL_PATH_VAL \
                      -e API_KEY=\$API_KEY_VAL \
                      -e AWS_REGION=\$REGION \
                      -e ENABLE_CLOUDWATCH=1 \
                      -e CPU_LIMIT=2 \
                      \$PREV_IMAGE
                    echo \"Rolled back to \$PREV_IMAGE\"
                  fi
                  exit 1
                fi
              "

      - name: Verify deployment from GitHub runner
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
              http://${{ secrets.EC2_HOST }}:8000/health 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "Deployment verified." && exit 0
            sleep 5
          done
          echo "Deployment verification failed."
          exit 1
