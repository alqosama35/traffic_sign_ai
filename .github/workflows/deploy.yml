# ============================================================
# CI/CD Pipeline — Build · Test · Push · Deploy (microservices)
# ============================================================

name: Build · Test · Push · Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION:    eu-north-1
  ECR_REGISTRY:  ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com

jobs:
  # ════════════════════════════════════════════════════════
  # STAGE 1 — BUILD (all 6 service images in parallel)
  # ════════════════════════════════════════════════════════
  build:
    name: "Stage 1 · Build (${{ matrix.service }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - service: gateway
            dockerfile: services/gateway/Dockerfile
          - service: inference
            dockerfile: services/inference/Dockerfile
          - service: cv
            dockerfile: services/cv/Dockerfile
          - service: ga
            dockerfile: services/ga/Dockerfile
          - service: audit
            dockerfile: services/audit/Dockerfile
          - service: dashboard
            dockerfile: services/dashboard/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Build image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t $ECR_REGISTRY/traffic-sign-${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/traffic-sign-${{ matrix.service }}:latest \
            .

      - name: Save image tar
        run: docker save $ECR_REGISTRY/traffic-sign-${{ matrix.service }}:latest -o /tmp/${{ matrix.service }}.tar

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp/${{ matrix.service }}.tar
          retention-days: 1

  # ════════════════════════════════════════════════════════
  # STAGE 2 — TEST
  # Step A: unit test inference-svc alone (MODEL_TEST_MODE=1,
  #         RABBITMQ_URL="" so broker publish is disabled)
  # Step B: full-stack smoke test via docker compose
  # ════════════════════════════════════════════════════════
  test:
    name: "Stage 2 · Test"
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      # ── Step A: inference-svc unit test (test_api.py) ────────────────────
      - uses: actions/download-artifact@v4
        with:
          name: inference-image
          path: /tmp

      - name: Load inference image
        run: docker load -i /tmp/inference.tar

      - name: Start inference-svc (stub model, no broker)
        run: |
          docker run -d \
            --name inference-svc \
            -p 8000:8001 \
            -e MODEL_TEST_MODE=1 \
            -e API_KEY=ci-test-key \
            -e RABBITMQ_URL="" \
            $ECR_REGISTRY/traffic-sign-inference:latest

      - name: Wait for inference-svc to be healthy
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000/health 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "Healthy." && exit 0
            echo "Attempt $i — HTTP $STATUS, retrying in 3s ..."
            sleep 3
          done
          echo "inference-svc never became healthy."
          docker logs inference-svc
          exit 1

      - name: Install test deps
        run: pip install requests pillow

      - name: Run test_api.py against inference-svc
        env:
          API_KEY: ci-test-key
        run: python test_api.py

      - name: Dump inference logs on failure
        if: failure()
        run: docker logs inference-svc

      - name: Stop inference-svc
        run: docker stop inference-svc && docker rm inference-svc

      # ── Step B: full-stack smoke test via docker compose ─────────────────
      - uses: actions/download-artifact@v4
        with:
          name: cv-image
          path: /tmp
      - uses: actions/download-artifact@v4
        with:
          name: ga-image
          path: /tmp
      - uses: actions/download-artifact@v4
        with:
          name: audit-image
          path: /tmp
      - uses: actions/download-artifact@v4
        with:
          name: dashboard-image
          path: /tmp
      - uses: actions/download-artifact@v4
        with:
          name: gateway-image
          path: /tmp

      - name: Load all images
        run: |
          for svc in inference cv ga audit dashboard gateway; do
            docker load -i /tmp/$svc.tar
          done

      - name: Retag images for docker compose
        run: |
          for svc in inference cv ga audit dashboard gateway; do
            docker tag $ECR_REGISTRY/traffic-sign-$svc:latest traffic-sign-$svc:deploy
          done

      - name: Start full stack (smoke test)
        env:
          MODEL_TEST_MODE: "1"
          API_KEY: ""
          INTERNAL_API_KEY: ""
          RABBITMQ_USER: guest
          RABBITMQ_PASS: guest
        run: docker compose -f docker-compose.yml up --no-build -d

      - name: Wait for RabbitMQ to be healthy
        run: |
          for i in $(seq 1 20); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q rabbitmq) 2>/dev/null || echo "unknown")
            [ "$STATUS" = "healthy" ] && echo "RabbitMQ healthy." && exit 0
            echo "Attempt $i — RabbitMQ status: $STATUS, retrying in 5s ..."
            sleep 5
          done
          echo "RabbitMQ never became healthy."
          docker compose logs rabbitmq
          exit 1

      - name: Smoke test gateway health
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost/health 2>/dev/null || echo "000")
            [ "$STATUS" = "200" ] && echo "Gateway healthy." && exit 0
            echo "Attempt $i — HTTP $STATUS, retrying in 3s ..."
            sleep 3
          done
          echo "Gateway never became healthy."
          docker compose logs
          exit 1

      - name: Smoke test predict through gateway
        run: |
          python - << 'EOF'
          import io, requests
          from PIL import Image, ImageDraw
          img = Image.new("RGB", (224, 224), color=(220, 50, 50))
          buf = io.BytesIO()
          img.save(buf, format="JPEG")
          buf.seek(0)
          r = requests.post("http://localhost/predict", files={"file": ("test.jpg", buf, "image/jpeg")})
          assert r.status_code == 200, f"Expected 200, got {r.status_code}: {r.text}"
          d = r.json()
          assert "class" in d and "confidence" in d, f"Bad response: {d}"
          print(f"Smoke test passed: {d['class']} ({d['confidence']:.1%})")
          EOF

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down

  # ════════════════════════════════════════════════════════
  # STAGE 3 — PUSH TO ECR (all 6 service images)
  # ════════════════════════════════════════════════════════
  push-to-ecr:
    name: "Stage 3 · Push (${{ matrix.service }})"
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15

    strategy:
      matrix:
        service: [gateway, inference, cv, ga, audit, dashboard]

    steps:
      - name: Compute short SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/${{ matrix.service }}.tar

      - name: Re-tag with short SHA
        run: |
          docker tag \
            $ECR_REGISTRY/traffic-sign-${{ matrix.service }}:latest \
            $ECR_REGISTRY/traffic-sign-${{ matrix.service }}:$IMAGE_TAG

      - name: Authenticate to ECR
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
            docker login --username AWS --password-stdin $ECR_REGISTRY

      - name: Push image
        run: |
          docker push $ECR_REGISTRY/traffic-sign-${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/traffic-sign-${{ matrix.service }}:latest

  # ════════════════════════════════════════════════════════
  # STAGE 4 — DEPLOY TO EC2
  # Uses docker compose on EC2 with all 6 services.
  # EC2 IAM role provides AWS credentials — no secrets over SSH.
  # Rollback: re-deploy previous compose stack on health failure.
  # ════════════════════════════════════════════════════════
  deploy:
    name: "Stage 4 · Deploy to EC2"
    runs-on: ubuntu-latest
    needs: push-to-ecr
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy docker-compose.yml to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            docker-compose.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/docker-compose.yml

      - name: Deploy on EC2
        env:
          REGISTRY:         ${{ env.ECR_REGISTRY }}
          TAG:              ${{ env.IMAGE_TAG }}
          MODEL_PATH:       ${{ secrets.MODEL_PATH }}
          API_KEY:          ${{ secrets.API_KEY }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          RABBITMQ_PASS:    ${{ secrets.RABBITMQ_PASS }}
          S3_BUCKET:        ${{ secrets.S3_BUCKET }}
        run: |
          ssh -i ~/.ssh/deploy_key \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              "
                set -e

                REGISTRY=$REGISTRY
                TAG=$TAG
                SERVICES='gateway inference cv ga audit dashboard'

                # Authenticate to ECR using EC2 IAM role
                aws ecr get-login-password --region $AWS_REGION | \
                  docker login --username AWS --password-stdin \$REGISTRY

                # Pull all service images and retag for docker compose
                for svc in \$SERVICES; do
                  echo \"Pulling traffic-sign-\$svc:\$TAG ...\"
                  docker pull \$REGISTRY/traffic-sign-\$svc:\$TAG
                  docker tag  \$REGISTRY/traffic-sign-\$svc:\$TAG \
                              \$REGISTRY/traffic-sign-\$svc:latest
                  docker tag  \$REGISTRY/traffic-sign-\$svc:\$TAG \
                              traffic-sign-\$svc:deploy
                done

                # Write .env for docker compose
                {
                  echo \"MODEL_PATH=$MODEL_PATH\"
                  echo \"API_KEY=$API_KEY\"
                  echo \"INTERNAL_API_KEY=$INTERNAL_API_KEY\"
                  echo \"RABBITMQ_USER=traffic\"
                  echo \"RABBITMQ_PASS=$RABBITMQ_PASS\"
                  echo \"AWS_REGION=$AWS_REGION\"
                  echo \"ENABLE_CLOUDWATCH=1\"
                  echo \"S3_BUCKET=$S3_BUCKET\"
                } > /home/${{ secrets.EC2_USER }}/.env

                cd /home/${{ secrets.EC2_USER }}

                # Stop any container occupying port 80 (e.g. old monolith)
                docker ps -q --filter publish=80 | xargs -r docker stop || true

                # Stop old stack
                docker compose down --remove-orphans || true

                # Start new stack (images already pulled and tagged — no build on EC2)
                docker compose up -d --no-build

                # Health check on gateway (port 80)
                echo 'Waiting for gateway health check ...'
                HEALTHY=0
                for i in \$(seq 1 20); do
                  STATUS=\$(curl -sf -o /dev/null -w '%{http_code}' \
                    http://localhost/health 2>/dev/null || echo '000')
                  if [ \"\$STATUS\" = '200' ]; then
                    HEALTHY=1
                    echo 'Deployment healthy.'
                    break
                  fi
                  echo \"Attempt \$i — HTTP \$STATUS, retrying ...\"
                  sleep 5
                done

                if [ \$HEALTHY -eq 0 ]; then
                  echo 'HEALTH CHECK FAILED — service logs:'
                  docker compose logs --tail=50
                  echo '--- rolling back: stopping stack ---'
                  docker compose down --remove-orphans || true
                  exit 1
                fi
              "
